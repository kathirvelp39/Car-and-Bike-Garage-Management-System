[project]
name = "garage-management-system"
version = "0.1.0"
description = "Car and Bike Garage Management System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi",
    "pydantic-settings",
    "pymysql",
    "python-dotenv",
    "sqlalchemy",
    "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
